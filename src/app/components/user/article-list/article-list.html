<div class="py-8">
  <h1 class="text-2xl font-bold text-gray-800 mb-6">Articles</h1>
  <!-- Filter and sort options I will implement later -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    @for (article of articles(); track article.id) {
      <app-article-card [article]="article" base="/articles" />
    }@empty {
      <div class="col-span-full rounded-2xl border border-dashed border-gray-300 bg-gray-50 px-6 py-10 text-center">
        <p class="text-lg font-medium text-gray-600">No articles available.</p>
        <p class="mt-1 text-sm text-gray-500">Please check back later.</p>
      </div>
    }
  </div>
</div>
