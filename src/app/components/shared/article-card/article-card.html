<a
  [routerLink]="[base(), article().id]"
  class="block bg-white rounded-xl shadow-md overflow-hidden transition hover:shadow-xl"
>
  <img
    [src]="article().photo"
    [alt]="article().nom"
    class="w-full h-48 object-cover"
    [class.grayscale]="!article().disponible"
  />

  <div class="p-4 space-y-1">
    <span class="text-xs uppercase tracking-wide text-cyan-700">
      {{ article().categorie }}
    </span>

    <h3 class="text-lg font-semibold text-gray-800 truncate">
      {{ article().nom }}
    </h3>

    <div class="flex items-center justify-between pt-1">
      <p class="font-bold text-orange-600">{{ article().prix }} TND</p>

      <span
        class="text-xs px-2 py-1 rounded-full"
        [class]="article().disponible ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'"
      >
        {{ article().disponible ? 'Available' : 'Sold' }}
      </span>
    </div>
  </div>
</a>
